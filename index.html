<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Per-client branding: %VITE_APP_*% are filled in at build time from
         Netlify's env vars for that site (see vite.config.js) -- falls back
         to Ship2Shore's own name/color when unset, same as the PWA manifest. -->
    <title>%VITE_APP_NAME%</title>
    <meta name="theme-color" content="%VITE_APP_THEME_COLOR%" />
    <!-- iOS ignores the web manifest for "Add to Home Screen" behavior --
         these are the only tags that actually control standalone mode,
         status bar style, and the home screen icon on iPhone/iPad. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_SHORT_NAME%" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
