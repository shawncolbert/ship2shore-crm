[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Gmail sync/enrichment now run as Supabase Edge Functions (pg_cron), scoped
# per-org to every connected gmail_oauth_tokens row -- not just Ship2Shore's.
# See supabase/functions/gmail-sync and supabase/functions/gmail-enrichment.

# Draft (never send) a suggested reply for any conversation awaiting one
[functions."ai-draft-reply"]
  schedule = "*/10 * * * *"

# Publish any Social Media Planner post whose scheduled time has arrived
[functions."tiktok-publish"]
  schedule = "*/10 * * * *"

# Email a payment reminder for any invoice with reminders opted in
# (invoices.reminder_enabled) once its interval has elapsed and it's still
# unpaid. Day-granularity logic, so once a day is plenty.
[functions."invoice-reminders"]
  schedule = "0 15 * * *"

# For every job scheduled to deliver tomorrow (Pacific), checks whether its
# balance invoice is paid -- nudges the customer and alerts the org's inbox
# if not, so payment gets chased down before the vehicle comes off the
# truck instead of being discovered at the tailgate.
[functions."delivery-payment-reminder"]
  schedule = "0 15 * * *"
