[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Gmail sync/enrichment now run as Supabase Edge Functions (pg_cron), scoped
# per-org to every connected gmail_oauth_tokens row -- not just Ship2Shore's.
# See supabase/functions/gmail-sync and supabase/functions/gmail-enrichment.

# Draft (never send) a suggested reply for any conversation awaiting one.
# PAUSED -- schedule commented out on request. Restore by uncommenting the
# schedule line below (function code is untouched, nothing else to redo).
# [functions."ai-draft-reply"]
#   schedule = "*/10 * * * *"

# Publish any Social Media Planner post whose scheduled time has arrived
[functions."tiktok-publish"]
  schedule = "*/10 * * * *"

# Push notification to the org owner's phone for any lead the
# unfollowed_lead_alerts view flags (10+ min assigned, no reply, no
# movement) -- the phone-notification counterpart to UnfollowedLeadToast,
# which only fires while the CRM is open in a browser tab.
[functions."check-unfollowed-leads"]
  schedule = "*/5 * * * *"

# Email a payment reminder for any invoice with reminders opted in
# (invoices.reminder_enabled) once its interval has elapsed and it's still
# unpaid. Day-granularity logic, so once a day is plenty.
[functions."invoice-reminders"]
  schedule = "0 15 * * *"

# For every job scheduled to deliver tomorrow (Pacific), checks whether its
# balance invoice is paid -- nudges the customer and alerts the org's inbox
# if not, so payment gets chased down before the vehicle comes off the
# truck instead of being discovered at the tailgate.
[functions."delivery-payment-reminder"]
  schedule = "0 15 * * *"

# Photography job milestones (Tre Colbert Photography, or any org with
# project_type set on a job): wedding T-60/T-14 day reminders, real-estate
# 24h post-shoot check-in, and the gallery-delivery draft once a link is
# added. Drafts into the Inbox for review -- never auto-sends.
[functions."photography-reminders"]
  schedule = "0 15 * * *"

# Lead-gen Phase 6 (2026-09-01): every job that's reached Delivered (or
# further -- Invoiced/Paid) gets a one-time "how did we do" email --
# thanks, a Google review ask (once Settings > Appearance has a review
# link set), and a referral ask. Never sends twice per job.
[functions."send-review-requests"]
  schedule = "0 15 * * *"
