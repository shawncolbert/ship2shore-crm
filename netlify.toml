[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Poll Gmail every 10 minutes for new mail to/from known contacts
[functions."gmail-sync"]
  schedule = "*/10 * * * *"

# Draft (never send) a suggested reply for any conversation awaiting one
[functions."ai-draft-reply"]
  schedule = "*/10 * * * *"

# Publish any Social Media Planner post whose scheduled time has arrived
[functions."tiktok-publish"]
  schedule = "*/10 * * * *"
